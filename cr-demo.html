<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>明契智审 · 合同审批系统 · 离线演示</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: #0f172a; overflow: hidden; }
  #stage { position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
  .slide { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; opacity: 0; transition: opacity .25s ease; pointer-events: none; }
  .slide.active { opacity: 1; pointer-events: auto; }
  .slide img { max-width: 96vw; max-height: 92vh; object-fit: contain; box-shadow: 0 8px 40px rgba(0,0,0,.5); border-radius: 4px; }
  #hud { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 14px; z-index: 10; }
  #counter { color: #cbd5e1; font: 13px/1 system-ui, sans-serif; letter-spacing: .5px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #475569; cursor: pointer; transition: background .2s; }
  .dot.active { background: #38bdf8; }
  #hint { position: fixed; top: 14px; left: 50%; transform: translateX(-50%); color: #64748b; font: 12px/1 system-ui, sans-serif; letter-spacing: .5px; z-index: 10; }
  #caption { position: fixed; bottom: 52px; left: 50%; transform: translateX(-50%); color: #e2e8f0; font: 14px/1 system-ui, sans-serif; z-index: 10; }
  #role { position: fixed; top: 12px; right: 16px; max-width: 46vw; padding: 7px 14px; border-radius: 999px;
          background: rgba(30,41,59,.85); border: 1px solid #334155; color: #e2e8f0;
          font: 12px/1.5 system-ui, sans-serif; z-index: 10; }
</style>
  <link rel="preload" as="image" href="shots/cr-slide-01.webp">
</head>
<body>
  <div id="hint">点击屏幕或按 → / ← 键翻页</div>
  <div id="stage"></div>
  <div id="caption"></div>
  <div id="role"></div>
  <div id="hud"><span id="counter"></span></div>
<script>
const SLIDES = [
  { label: "登录页 · 张经办（业务经办人）", role: "业务经办人｜可：提交合同送审 · 查看本人合同与报告｜不可：审批 · 改规则", src: "shots/cr-slide-01.webp" },
  { label: "合同审查大盘（仅本人合同）", role: "业务经办人｜可：提交合同送审 · 查看本人合同与报告｜不可：审批 · 改规则", src: "shots/cr-slide-02.webp" },
  { label: "审查报告（仅本人提交的合同）", role: "业务经办人｜可：提交合同送审 · 查看本人合同与报告｜不可：审批 · 改规则", src: "shots/cr-slide-03.webp" },
  { label: "登录页 · 李法务（法务审查人）", role: "法务审查人｜可：处理在途合同 · 编辑修改建议 · 协同回写意见｜不可：改判定 · 做审批", src: "shots/cr-slide-04.webp" },
  { label: "智能审查工作台 · 在途队列按风险排序", role: "法务审查人｜可：处理在途合同 · 编辑修改建议 · 协同回写意见｜不可：改判定 · 做审批", src: "shots/cr-slide-05.webp" },
  { label: "审查报告（全部合同可见）", role: "法务审查人｜可：处理在途合同 · 编辑修改建议 · 协同回写意见｜不可：改判定 · 做审批", src: "shots/cr-slide-06.webp" },
  { label: "登录页 · 王管理（系统管理员）", role: "系统管理员｜可：全局大盘 · 上传送审 · 规则模板配置 · 异常监控｜全角色可见性", src: "shots/cr-slide-07.webp" },
  { label: "上传合同送审 · 免填表单", role: "系统管理员｜可：全局大盘 · 上传送审 · 规则模板配置 · 异常监控｜全角色可见性", src: "shots/cr-slide-08.webp" },
  { label: "合规规则与模板 · 34 条规则", role: "系统管理员｜可：全局大盘 · 上传送审 · 规则模板配置 · 异常监控｜全角色可见性", src: "shots/cr-slide-09.webp" },
  { label: "系统通知 · 审查失败监控", role: "系统管理员｜可：全局大盘 · 上传送审 · 规则模板配置 · 异常监控｜全角色可见性", src: "shots/cr-slide-10.webp" }
];
let idx = 0;
const stage = document.getElementById('stage');
const counter = document.getElementById('counter');
const caption = document.getElementById('caption');
const role = document.getElementById('role');
const hud = document.getElementById('hud');

SLIDES.forEach((s, i) => {
  const d = document.createElement('div');
  d.className = 'slide' + (i === 0 ? ' active' : '');
  const img = document.createElement('img');
  img.alt = s.label;
  img.setAttribute('decoding', 'async');
  if (i === 0) { img.src = s.src; img.setAttribute('fetchpriority', 'high'); }
  else { img.dataset.src = s.src; }
  img.draggable = false;
  d.appendChild(img);
  stage.appendChild(d);

  const dot = document.createElement('span');
  dot.className = 'dot' + (i === 0 ? ' active' : '');
  dot.addEventListener('click', (e) => { e.stopPropagation(); go(i); });
  hud.appendChild(dot);
});

function ensure(n) {
  const img = document.querySelectorAll('.slide img')[n];
  if (img && img.dataset.src) { img.src = img.dataset.src; img.removeAttribute('data-src'); }
}

function go(n) {
  idx = (n + SLIDES.length) % SLIDES.length;
  ensure(idx);
  ensure((idx + 1) % SLIDES.length);
  document.querySelectorAll('.slide').forEach((el, i) => el.classList.toggle('active', i === idx));
  document.querySelectorAll('.dot').forEach((el, i) => el.classList.toggle('active', i === idx));
  counter.textContent = (idx + 1) + ' / ' + SLIDES.length;
  caption.textContent = SLIDES[idx].label;
  role.textContent = SLIDES[idx].role;
}
function next() { go(idx + 1); }
function prev() { go(idx - 1); }

stage.addEventListener('click', (e) => {
  if (e.target.tagName === 'IMG' || e.target.id === 'stage') next();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight' || e.key === ' ') next();
  else if (e.key === 'ArrowLeft') prev();
});
go(0);
</script>
</body>
</html>
